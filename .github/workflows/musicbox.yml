name: Animated props (music box / watch / camera / chest)

# 使い方:
# 静止画の確認: gh workflow run musicbox.yml -f script=props_watch -f tag=watch-v1 -f chunks='[[90,90]]'
# 動画:         gh workflow run musicbox.yml -f tag=musicbox-v1 -f video=1
# 結果は Release(tag名)に添付: gh release download <tag> -R DiceKakumei/landscape-3d-cloud-pilot -D <保存先>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Releaseのタグ名'
        required: true
      chunks:
        description: '描画するフレーム範囲(JSON配列 [[開始,終了],...])'
        required: false
        default: "[[1,18],[19,36],[37,54],[55,72],[73,90],[91,108],[109,126],[127,144]]"
      video:
        description: '1=チャンクを結合してmp4/gifを作る'
        required: false
        default: "0"
      script:
        description: 'scripts/ 内のスクリプト名(拡張子なし)'
        required: false
        default: "musicbox"
      samples:
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --title "${{ inputs.tag }}" --notes "music box" || true

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        range: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender
        run: |
          curl -L -o blender.tar.xz "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          mv blender-5.0.1-linux-x64 blender
          echo "$(pwd)/blender" >> "$GITHUB_PATH"
      - name: Render
        run: blender --background --python scripts/${{ inputs.script }}.py -- ${{ matrix.range[0] }} ${{ matrix.range[1] }} frames ${{ inputs.samples }}
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=$(printf %04d ${{ matrix.range[0] }})
          cp frames/f$S.png still_$S.png
          tar -cf chunk_$S.tar -C frames .
          gh release upload "${{ inputs.tag }}" still_$S.png chunk_$S.tar --clobber

  video:
    needs: render
    if: inputs.video == '1'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" -p 'chunk_*.tar'
          mkdir frames && for t in chunk_*.tar; do tar -xf $t -C frames; done
          ffmpeg -y -framerate 24 -pattern_type glob -i 'frames/f*.png' -c:v libx264 -pix_fmt yuv420p -crf 18 ${{ inputs.script }}.mp4
          ffmpeg -y -i ${{ inputs.script }}.mp4 -vf "fps=12,scale=480:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" ${{ inputs.script }}.gif
          gh release upload "${{ inputs.tag }}" ${{ inputs.script }}.mp4 ${{ inputs.script }}.gif --clobber --repo "$GITHUB_REPOSITORY"
