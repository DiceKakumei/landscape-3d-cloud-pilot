name: Retopo (QuadriFlow)

# 使い方:
# gh workflow run retopo.yml -f assets_json='[{"name":"character.glb","url":"https://..."}]' -f target_faces=5000
# assets/内の各glbを1つずつ自動リトポし、output/<name>_retopo.glbとして出力する。

on:
  workflow_dispatch:
    inputs:
      assets_json:
        description: '[{"name":"character.glb","url":"https://..."}, ...] 形式のJSON配列(署名付きURLの期限に注意)'
        required: false
        default: "[]"
      target_faces:
        description: '自動リトポの目標面数'
        required: false
        default: "5000"

jobs:
  retopo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender
        run: |
          curl -L -o blender.tar.xz "https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          mv blender-4.2.23-linux-x64 blender
          echo "$(pwd)/blender" >> "$GITHUB_PATH"

      - name: Download assets
        run: |
          mkdir -p assets output
          echo '${{ inputs.assets_json }}' > assets.json
          jq -c '.[]' assets.json | while read -r item; do
            name=$(echo "$item" | jq -r '.name')
            url=$(echo "$item" | jq -r '.url')
            echo "downloading $name"
            curl -L -o "assets/$name" "$url"
          done
          ls -la assets

      - name: Retopo
        env:
          TARGET_FACES: ${{ inputs.target_faces }}
        run: |
          blender --background --python scripts/retopo_quadriflow.py

      - uses: actions/upload-artifact@v4
        with:
          name: retopo-output
          path: output/*.glb
          retention-days: 14
