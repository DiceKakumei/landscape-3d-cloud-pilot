name: CG zoom

# 使い方:
# 静止画の確認: gh workflow run cg_zoom.yml -f tag=cgz-still1 -f frames=0,60,120,180,240,300
# 動画(360コマ/15秒): gh workflow run cg_zoom.yml -f tag=cgz-v1 -f width=720 -f samples=24
# 結果は Release（tag名）に添付: gh release download <tag> -R DiceKakumei/landscape-3d-cloud-pilot -D <保存先>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Releaseのタグ名'
        required: true
      frames:
        description: '静止画で確認するコマ（例: 0,60,120）。空なら動画全体'
        required: false
        default: ""
      width:
        description: '横幅px（縦は16:9）'
        required: false
        default: "720"
      samples:
        description: 'Cyclesのサンプル数'
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        env:
          FRAMES: ${{ inputs.frames }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FRAMES" ]; then echo "parts=[0]" >> "$GITHUB_OUTPUT"
          else echo "parts=[$(seq -s, 0 17)]" >> "$GITHUB_OUTPUT"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "cg_zoom"

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.prep.outputs.parts) }}
    env:
      FRAMES: ${{ inputs.frames }}
      TAG: ${{ inputs.tag }}
      PART: ${{ matrix.part }}
      WIDTH: ${{ inputs.width }}
      SAMPLES: ${{ inputs.samples }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender
        run: |
          # 公式がランナーにHTMLページ(約60KB)を返すことがあるので、xzとして読めるまでミラーを順に試す
          for base in https://download.blender.org https://mirrors.ocf.berkeley.edu/blender https://mirror.clarkson.edu/blender; do
            curl -fL -o blender.tar.xz "$base/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz" && xz -t blender.tar.xz && break
          done
          tar -xf blender.tar.xz
          mv blender-5.0.1-linux-x64 blender
          echo "$(pwd)/blender" >> "$GITHUB_PATH"

      - name: Render
        run: |
          # 360コマを18分割(1ジョブ20コマ)
          range=${FRAMES:-$((PART * 20))-$((PART * 20 + 19))}
          blender --background --python-exit-code 1 --python scripts/cg_zoom.py -- output "$range" "$WIDTH" "$SAMPLES"

      - name: Upload stills
        if: inputs.frames != ''
        run: |
          for f in output/*.png; do mv "$f" "output/$TAG-$(basename "$f")"; done
          gh release upload "$TAG" output/*.png

      - name: Upload segment
        if: inputs.frames == ''
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          name=$(printf 'part%02d.mp4' "$PART")
          ffmpeg -y -framerate 24 -pattern_type glob -i 'output/*.png' -c:v libx264 -pix_fmt yuv420p -crf 16 "$name"
          gh release upload "$TAG" "$name"

  join:
    needs: render
    if: inputs.frames == ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Concat
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'part*.mp4'
          test "$(ls part*.mp4 | wc -l)" = 18
          printf "file '%s'\n" part*.mp4 > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy -movflags +faststart "$TAG.mp4"
          gh release upload "$TAG" "$TAG.mp4" --repo "$GITHUB_REPOSITORY"
