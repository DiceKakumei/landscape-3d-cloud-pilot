name: Infinite zoom

# 使い方:
# gh workflow run infinite_zoom.yml -f tag=izoom-v1 -f step=1
# step: 何フレームおきに描くか（24の約数。24=確認用の12コマ / 1=本番の全フレーム）
# 結果（mp4と一覧画像）は Release（tag名）に添付:
# gh release download <tag> -R DiceKakumei/landscape-3d-cloud-pilot -D <保存先>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Releaseのタグ名'
        required: true
      step:
        description: '何フレームおきに描くか（24の約数。24=確認用 / 1=本番）'
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      STEP: ${{ inputs.step }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender
        run: |
          curl -L -o blender.tar.xz "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          mv blender-5.0.1-linux-x64 blender
          echo "$(pwd)/blender" >> "$GITHUB_PATH"

      - name: Render frames
        run: blender --background --python scripts/infinite_zoom.py -- output/frames "$STEP"

      - name: Encode
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          count=$(ls output/frames | wc -l)
          ffmpeg -y -framerate $((24 / STEP)) -pattern_type glob -i 'output/frames/*.png' \
            -c:v libx264 -pix_fmt yuv420p -crf 18 "output/$TAG.mp4"
          # 等間隔に12コマ抜いた一覧画像（確認用）
          ffmpeg -y -pattern_type glob -i 'output/frames/*.png' \
            -vf "select='not(mod(n,$((count / 12))))',scale=240:-1,tile=6x2" -frames:v 1 "output/$TAG.png"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "output/$TAG.mp4" "output/$TAG.png" --title "$TAG" --notes "step=$STEP"
