name: Render landscape pilot

on:
  workflow_dispatch:
    inputs:
      bench_glb_url:
        description: "bench.glb の署名付きダウンロードURL"
        required: true
      tree_glb_url:
        description: "tree.glb の署名付きダウンロードURL"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender
        run: |
          curl -L -o blender.tar.xz "https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          mv blender-4.2.23-linux-x64 blender
          echo "$(pwd)/blender" >> "$GITHUB_PATH"

      - name: Download assets
        run: |
          mkdir -p assets output
          curl -L -o assets/bench.glb "${{ inputs.bench_glb_url }}"
          curl -L -o assets/tree.glb "${{ inputs.tree_glb_url }}"
          ls -la assets

      - name: Build scene and render
        run: |
          blender --background --python scripts/build_scene.py

      - uses: actions/upload-artifact@v4
        with:
          name: landscape-pilot-render
          path: |
            output/render.png
            output/scene.blend
          retention-days: 14
