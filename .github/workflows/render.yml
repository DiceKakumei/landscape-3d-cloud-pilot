name: Render landscape scene

# 使い方:
# gh workflow run render.yml -f assets_json='[{"name":"tree.glb","url":"https://..."},{"name":"rock.glb","url":"https://..."}]'
# build_scene.py 側で bpy プリミティブ組み立てのみで済むオブジェクト(ベンチ等)は
# glb を経由しないので、assets_json に含める必要はない。

on:
  workflow_dispatch:
    inputs:
      assets_json:
        description: '[{"name":"tree.glb","url":"https://..."}, ...] 形式のJSON配列(Meshyの署名付きURLは発行から約3日で失効するため、直前に取り直してから渡すこと)'
        required: false
        default: "[]"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender
        run: |
          curl -L -o blender.tar.xz "https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          mv blender-4.2.23-linux-x64 blender
          echo "$(pwd)/blender" >> "$GITHUB_PATH"

      - name: Download assets
        run: |
          mkdir -p assets output
          echo '${{ inputs.assets_json }}' > assets.json
          jq -c '.[]' assets.json | while read -r item; do
            name=$(echo "$item" | jq -r '.name')
            url=$(echo "$item" | jq -r '.url')
            echo "downloading $name"
            curl -L -o "assets/$name" "$url"
          done
          ls -la assets

      - name: Build scene and render
        run: |
          blender --background --python scripts/build_scene.py

      - uses: actions/upload-artifact@v4
        with:
          name: landscape-render
          path: |
            output/render.png
            output/scene.blend
          retention-days: 14
